name: Validate Mahmoud data pipeline
on:
  pull_request:
  push:
    branches: [main, mahmoud/complete-assigned-deliverables]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python src/run_pipeline.py
      - run: python -m unittest discover -s tests -v
      - run: python src/publish_adls.py --dry-run
